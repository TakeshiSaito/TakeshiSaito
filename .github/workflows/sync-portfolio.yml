name: Sync README to Portfolio

on:
  push:
    branches: [main]
    paths: [README.md]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile repo
        uses: actions/checkout@v4

      - name: Generate content_option.js via GitHub Models
        id: generate
        env:
          GH_TOKEN: ${{ secrets.PORTFOLIO_PAT }}
        run: |
          cat > prompt.txt << 'PROMPT_END'
          You are a code generator. Given the following GitHub profile README, generate a JavaScript file named content_option.js for a React portfolio site.

          RULES:
          - Output ONLY valid JavaScript code. No markdown, no explanation, no code fences.
          - Keep the exact same export structure and variable names as the TEMPLATE below.
          - Update ONLY the data values based on the README content.
          - For dataportfolio and home_img_url and e_mail: keep the TEMPLATE values exactly as-is (do NOT change image paths or links).
          - For socialprofils: keep the TEMPLATE values exactly as-is unless the README explicitly provides different URLs.
          - For skills: map from the README "Core Skills & Expertise" section. Assign reasonable percentage values (50-95).
          - For careers: map from the README "Professional Experience" table.
          - For certifications: map from the README "Certifications" section.
          - For introdata.description: use the subtitle from the README header.
          - For dataabout.aboutme: use the "About Me" section text, joined with \n between paragraphs.
          - For meta.description: write a short one-liner based on current role.

          TEMPLATE (preserve this structure exactly):
          const logotext = "SAITO";

          const introdata = {
              title: "I`m Takeshi Saito",
              animated: {
                  first: "I develop CG pipelines",
                  second: "I build tools for production",
                  third: "I love computer graphics",
              },
              description: "...",
              home_img_url: `/dhw-still-half.jpg`,
              e_mail: "takeshi.saito.9119@gmail.com"
          };

          const meta = {
              title: "Takeshi Saito",
              description: "...",
          }
          const socialprofils = {
              github: "https://github.com/TakeshiSaito",
              linkedin: "https://www.linkedin.com/in/takeshi-saito-aa6894180/",
              artstation: "https://www.artstation.com/takeshisaito",
          };
          const dataabout = {
              title: "About me",
              aboutme: "...",
          };
          const skills = [ { name: "...", value: 90 } ];
          const careers = [ { title: "...", description: "..." } ];
          const certifications = [ { title: "...", date: "..." } ];
          const dataportfolio = [
              { img: `/anome2.png`, description: "Meido Sarasa \u201CMonday the 13th\u201D Official MV", link: "https://youtu.be/2I_alumYC1I?si=cRAqqLqBYKQpD0cx" },
              { img: `/riverreve.jpg`, description: "ReverseBlue\u00D7ReverseEnd", link: "https://rxr.happyelements.co.jp/" },
              { img: `/brebre.png`, description: "BraveSword\u00D7BlazeSoul", link: "https://grimoire.co/bxb/" },
              { img: `/ge-cloe-crop.jpg`, description: "Individual game project", link: "https://unityroom.com/games/growth_minigame" },
              { img: `/dhw-still-icon.jpg`, description: "Digital Hollywood assignment", link: "https://www.artstation.com/artwork/bKqQLv" }
          ];

          export { introdata, meta, logotext, socialprofils, dataabout, skills, careers, certifications, dataportfolio };
          PROMPT_END

          # Build the API request using file inputs (avoids shell escaping issues)
          jq -n \
            --rawfile system prompt.txt \
            --rawfile readme README.md \
            '{
              model: "gpt-4o",
              messages: [
                { role: "system", content: $system },
                { role: "user",   content: ("Here is the README:\n\n" + $readme) }
              ],
              temperature: 0.1
            }' > request.json

          # Call GitHub Models API (no separate API key needed)
          curl -s https://models.inference.ai.azure.com/chat/completions \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Content-Type: application/json" \
            -d @request.json \
            -o response.json

          # Extract the generated code
          jq -r '.choices[0].message.content' response.json > content_option.js

          # Validate: must contain export statement
          if ! grep -q "export" content_option.js; then
            echo "ERROR: Generated file does not contain exports"
            cat response.json
            exit 1
          fi

          echo "Generated content_option.js successfully"
          cat content_option.js

      - name: Push to react-portfolio-client
        env:
          PORTFOLIO_PAT: ${{ secrets.PORTFOLIO_PAT }}
        run: |
          git clone https://x-access-token:${PORTFOLIO_PAT}@github.com/TakeshiSaito/react-portfolio-client.git portfolio
          cp content_option.js portfolio/src/content_option.js
          cd portfolio
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/content_option.js
          if git diff --cached --quiet; then
            echo "No changes detected, skipping push"
          else
            git commit -m "Auto-sync content from profile README [skip ci]"
            git push
            echo "Pushed updated content_option.js"
          fi

